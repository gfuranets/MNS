<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account - Health Companion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth">
  <div class="logo">💚 Health Companion</div>

  <div class="panel">
    <h1>Create account</h1>
    <p class="subtitle">Your details are stored so reminders can reach you.</p>

    <form id="signup-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="8"
               autocomplete="new-password">
      </div>

      <div class="form-grid">
        <div class="field">
          <label for="name">First name</label>
          <input type="text" id="name" required maxlength="40">
        </div>

        <div class="field">
          <label for="surname">Surname</label>
          <input type="text" id="surname" required maxlength="40">
        </div>

        <div class="field">
          <label for="birth_date">Date of birth</label>
          <input type="date" id="birth_date" required>
        </div>

        <div class="field">
          <label for="phone">Phone (optional)</label>
          <input type="tel" id="phone" maxlength="20">
        </div>
      </div>

      <div class="field">
        <label for="address">Address</label>
        <input type="text" id="address" required maxlength="50">
      </div>

      <div class="form-grid">
        <div class="field">
          <label for="city">City</label>
          <input type="text" id="city" required maxlength="20">
        </div>

        <div class="field">
          <label for="country">Country</label>
          <input type="text" id="country" required maxlength="20">
        </div>
      </div>

      <button type="submit" class="primary-btn">Create account</button>
      <p class="message" id="message"></p>
    </form>

    <p class="auth-alt">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</div>

<script src="auth.js"></script>
<script>
  const form = document.getElementById("signup-form");
  const message = document.getElementById("message");
  const value = (id) => document.getElementById(id).value;

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const button = form.querySelector("button");
    button.disabled = true;
    showMessage(message, "");

    const credentials = { email: value("email"), password: value("password") };

    try {
      await api("/api/signup", {
        method: "POST",
        body: {
          ...credentials,
          name: value("name"),
          surname: value("surname"),
          birth_date: value("birth_date"),
          address: value("address"),
          city: value("city"),
          country: value("country"),
          phone: value("phone") || null,
        },
      });

      // Signing up does not return a token, so log in straight away.
      const session = await api("/api/login", { method: "POST", body: credentials });
      token.set(session.access_token);
      window.location.replace("index.html");
    } catch (error) {
      showMessage(message, error.message);
      button.disabled = false;
    }
  });
</script>

</body>
</html>
