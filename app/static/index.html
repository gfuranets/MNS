<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Health Companion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- One page, many screens. script.js renders the screen named in the URL
     hash (#/home, #/schedule, #/checkup/3 ...) into #view. -->
<div class="phone">
  <header class="topbar" id="topbar"></header>

  <main class="content" id="view">
    <p class="loading">Loading…</p>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Main">
    <a href="#/home" data-tab="home">Home</a>
    <a href="#/schedule" data-tab="schedule">Schedule</a>
    <a href="#/log" data-tab="log">Log</a>
    <a href="#/prep" data-tab="prep">Prep</a>
    <a href="#/settings" data-tab="settings">Settings</a>
  </nav>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="auth.js"></script>
<script src="script.js"></script>

</body>
</html>
