<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in - Health Companion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth">
  <div class="logo">💚 Health Companion</div>

  <div class="panel">
    <h1>Log in</h1>
    <p class="subtitle">Enter the email and password you signed up with.</p>

    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>

      <button type="submit" class="primary-btn">Log in</button>
      <p class="message" id="message"></p>
    </form>

    <p class="auth-alt">No account yet? <a href="signup.html">Create one</a></p>
  </div>
</div>

<script src="auth.js"></script>
<script>
  const form = document.getElementById("login-form");
  const message = document.getElementById("message");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const button = form.querySelector("button");
    button.disabled = true;
    showMessage(message, "");

    try {
      const data = await api("/api/login", {
        method: "POST",
        body: {
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
        },
      });
      token.set(data.access_token);
      window.location.replace("index.html");
    } catch (error) {
      showMessage(message, error.message);
      button.disabled = false;
    }
  });
</script>

</body>
</html>
