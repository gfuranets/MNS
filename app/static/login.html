<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - Health Companion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="phone auth-page">
  <header class="topbar"><h1>Sign in</h1></header>

  <main class="content">
    <div class="auth-mark">
      <div class="logo">HC</div>
      <p class="muted">Know what's due. Show up ready.</p>
    </div>

    <form id="login-form">
      <label class="box">
        <span class="cap">Email</span>
        <input type="email" id="email" required autocomplete="email" placeholder="you@example.com">
      </label>
      <label class="box">
        <span class="cap">Password</span>
        <input type="password" id="password" required autocomplete="current-password">
      </label>

      <div class="form-foot">
        <button type="submit" class="btn primary">Sign in</button>
      </div>
      <p class="message" id="message"></p>
    </form>

    <p class="auth-alt">New here? <a href="signup.html">Create an account</a></p>
    <p class="auth-foot">Your health data is never sold.</p>
  </main>
</div>

<script src="auth.js"></script>
<script>
  const form = document.getElementById("login-form");
  const message = document.getElementById("message");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const button = form.querySelector("button");
    button.disabled = true;
    showMessage(message, "");

    try {
      const data = await api("/api/login", {
        method: "POST",
        body: {
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
        },
      });
      token.set(data.access_token);
      window.location.replace("index.html");
    } catch (error) {
      showMessage(message, error.message);
      button.disabled = false;
    }
  });
</script>

</body>
</html>
